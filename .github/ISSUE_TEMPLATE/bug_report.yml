
name: Bug report
description: Something isn't working as expected.
title: "[BUG] "
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Sign in
        2. Open the page
        3. Reproduce the problem
    validations:
      required: true

  - type: dropdown
    id: role
    attributes:
      label: Signed in as
      options:
        - Participant
        - Judge
        - Organizer
        - Signed out
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Bug severity
      description: How seriously does this bug affect your work?
      options:
        - Low
        - Medium
        - High
        - Critical
    validations:
      required: true

  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - Live site (hackhub.mekhroj.uz)
        - Local development
        - Self-hosted with Docker
    validations:
      required: true

  - type: input
    id: page
    attributes:
      label: Page and device
      description: URL path and browser or phone.
      placeholder: /events/demo/team on Safari, iPhone

  - type: input
    id: version
    attributes:
      label: Version or commit

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove passwords, session cookies, AUTH_SECRET and database URLs before pasting.
      render: shell
