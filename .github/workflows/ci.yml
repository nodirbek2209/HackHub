name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests with coverage
        run: npm run test:coverage

      - name: Upload coverage reports to Codecov
        # Secrets aren't passed to pull requests from forks, so a missing
        # token there skips the upload instead of failing the build.
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: false

      - name: Build
        run: npm run build
        env:
          # dummy vals, real ones in deploy secrets
          DATABASE_URL: postgresql://user:pass@localhost:5432/hackhub
          AUTH_SECRET: ci-placeholder-secret
          AUTH_URL: http://localhost:3000
