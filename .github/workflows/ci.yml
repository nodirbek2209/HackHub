name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

# Read-only by default; jobs ask for more only where they need it.
permissions:
  contents: read

# A newer push to the same PR cancels the older run. Runs on master are never
# cancelled, so every commit that production deploys keeps its own result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Dummy values for steps that only need the variables to exist. Real ones
  # live on the server (docs/04 > Configuration).
  AUTH_SECRET: ci-placeholder-secret
  AUTH_URL: http://localhost:3000

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests with coverage
        run: npm run test:coverage

      - name: Upload coverage reports to Codecov
        # Secrets aren't passed to pull requests from forks, so a missing
        # token there skips the upload instead of failing the build.
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: false

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/hackhub

  # Runs the committed migrations on an empty PostgreSQL 18 (the production
  # version), as the deploy's migrate service does, then checks that
  # prisma/schema.prisma has no change that is missing a migration.
  migrations:
    name: Database migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: hackhub
          POSTGRES_PASSWORD: hackhub
          POSTGRES_DB: hackhub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hackhub -d hackhub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://hackhub:hackhub@localhost:5432/hackhub
      SEED_ORGANIZER_EMAIL: organizer@example.com
      SEED_ORGANIZER_PASSWORD: ci-organizer-password

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Seed the first organizer
        run: npx prisma db seed

      - name: Check the schema matches the migrations
        run: >-
          npx prisma migrate diff
          --from-config-datasource
          --to-schema prisma/schema.prisma
          --exit-code

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: hackhub
          POSTGRES_PASSWORD: hackhub
          POSTGRES_DB: hackhub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hackhub -d hackhub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      CI: true
      DATABASE_URL: postgresql://hackhub:hackhub@localhost:5432/hackhub
      SEED_ORGANIZER_EMAIL: organizer@example.com
      SEED_ORGANIZER_PASSWORD: ci-organizer-password
      # Demo accounts: CI only, never production (docs/04 > Demo data).
      SEED_DEMO_USERS: "true"
      SEED_DEMO_PASSWORD: ci-demo-password

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations and seed
        run: |
          npx prisma migrate deploy
          npx prisma db seed
          npm run db:seed:demo

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run end-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  # The production image is built on the server at deploy time. Building both
  # targets here catches a broken Dockerfile before master moves.
  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the migrate image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: migrate
          push: false
          cache-from: type=gha,scope=hackhub
          cache-to: type=gha,scope=hackhub,mode=max

      - name: Build the runner image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runner
          push: false
          cache-from: type=gha,scope=hackhub

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Production dependencies only: dev tooling never ships. Fails on high
      # and critical advisories.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
